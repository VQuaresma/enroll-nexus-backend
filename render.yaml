# Draft: provisioning these resources incurs charges. Review before applying.
# This defines a new deployment; do not use it to replace an existing database.
services:
  - type: web
    name: enroll-nexus-api-production
    runtime: python
    repo: https://github.com/VQuaresma/enroll-nexus-backend
    plan: starter
    buildCommand: bash build-render.sh
    startCommand: python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    autoDeployTrigger: off
    disk:
      name: enrollment-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.render_settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: enroll-nexus-production-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: FRONTEND_URL
        sync: false
databases:
  - name: enroll-nexus-production-db
    plan: basic-256mb
    databaseName: enroll_nexus
    user: enroll_nexus
